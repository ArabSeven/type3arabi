[package]
name = "t3a-hotkey"
description = "Optional companion: global Type3arabi activation hotkey (docs/02 §11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3a-hotkey"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
t3a-paths = { workspace = true }
t3a-engine = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_TextServices",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Console",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_Graphics_Gdi",
] }

[build-dependencies]
# Windows resources: brand icon + VERSIONINFO (docs/07 §1; ledger docs/01 §8).
embed-resource = "3"
