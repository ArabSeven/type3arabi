name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p t3a-cli -- eval data/eval/smoke.tsv
      - run: cargo run -q --release -p t3a-cli -- bench
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: astral-sh/setup-uv@v5
      - name: pipeline tests
        working-directory: tools/pipeline
        run: uv sync --extra dev && uv run pytest -q && uv run t3ap sources

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo build -p t3a-tip -p t3a-hotkey --release --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --workspace --target ${{ matrix.target }}
      # M1: add DLL size gate (docs/06 P7) and regsvr32 register/unregister smoke test (admin runner).
