# Dataset registry — the ONLY place that decides what data may be used and how (AGENTS.md R14).
#
# status:
#   approved        may influence shipped artifacts for the listed roles
#   eval-only       may be used for evaluation reports only (never training, never tuning)
#   owner-decision  treated as eval-only until the Owner records a decision in STATUS.md
#   blocked         must not be downloaded by the pipeline
# roles: lexicon | lm | charlm | diac | rules | tuning | eval | reference
#
# "license = 'unstated'" means we found no license. Default is eval-only; the action is to email the
# authors asking for CC-BY (or similar) permission, then flip to approved with the evidence path.

[[source]]
id = "fineweb2"
name = "FineWeb-2 (HuggingFaceFW/fineweb-2), Arabic-script subsets"
url = "https://huggingface.co/datasets/HuggingFaceFW/fineweb-2"
kind = "mono_arabic"
dialects = ["MSA", "LEV", "EGY", "GLF", "IRQ", "MAG"]
license = "ODC-By-1.0 (also subject to Common Crawl terms of use)"
status = "approved"
roles = ["lexicon", "lm", "charlm", "diac"]
notes = "Subsets: arb_Arab, arz_Arab, apc_Arab, ajp_Arab, afb_Arab, ars_Arab, acq_Arab, acm_Arab, ary_Arab, arq_Arab, aeb_Arab, ayl_Arab, apd_Arab (use those that exist). Attribution in NOTICE.md."

