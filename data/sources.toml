# Dataset registry — the ONLY place that decides what data may be used and how (AGENTS.md R14, ADR-0010).
# DATASETS.md is generated from this file: `uv run t3ap datasets-md` (tools/pipeline).
#
# The shipped model (type3arabi.dat) is licensed CC BY-NC-SA 4.0; the code is Apache-2.0.
#
# status:
#   approved        may shape the shipped model for the listed roles (license compatible with CC BY-NC-SA 4.0)
#   provisional     license unstated but published for public use; clearance requested; the Owner accepted
#                   using it in releases until the rights holder answers (O14, ADR-0011). Needs
#                   license_family = "unknown" (=> model CC BY-NC-SA), `asked` and a notes line saying when
#                   clearance was requested. On a decline: status = "blocked", rebuild, ship the new model;
#                   `t3ap --exclude-provisional pairs` rebuilds without every provisional source.
#   internal        license unstated; clearance requested; `--mode internal` builds only
#   eval-only       evaluation reports only (never training, never tuning)
#   owner-decision  treated as eval-only until the Owner records a decision in STATUS.md
#   blocked         never downloaded (incompatible license, unavailable, or superseded)
# roles: lexicon | lm | charlm | diac | rules | tuning | eval | reference
# license_family (approved sources): permissive (CC0/MIT/BSD/Apache/ODC-By/CC BY) | nc (CC BY-NC, CC BY-NC-SA)
#   `t3ap --exclude-nc all` rebuilds without every `nc` source (ADR-0010 exit path).
# Never in the model: CC BY-SA, ODbL, NoDerivatives, research-only, paid (LDC). Those may be eval-only.
# Permission emails: kept privately in docs/evidence/licenses/<id>.* (gitignored: personal data); record
#   "Permission granted <date> by <name>: <terms>" in notes, set license, license_family, status = "approved".

