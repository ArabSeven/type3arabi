[project]
name = "t3ap"
version = "0.1.0"
description = "Type3arabi data pipeline (docs/04-data-pipeline.md). Offline tooling; never shipped."
requires-python = ">=3.12"
dependencies = [
  "datasets>=3.0",
  "huggingface_hub>=0.25",
  "pyarrow>=17",
  "regex>=2024.9",
  "numpy>=2.0",
  "tqdm>=4.66",
  "zstandard>=0.23",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
t3ap = "t3ap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t3ap"]
