# cargo-deny policy — AGENTS.md R11. Run: cargo deny check
[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.9
# Our own crates are Apache-2.0 (ADR-0010) and unpublished.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# "Unmaintained" notices (no vulnerability, no fixed version exists) in the Settings app's Tauri 2 tree,
# reviewed 2026-09-25. Each must be re-checked when Tauri is updated; any other advisory still fails.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: compile-time proc macro in Tauri's tree, not in the binary" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: via tauri-utils > urlpattern; unmaintained, no vulnerability" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: via tauri-utils > urlpattern; unmaintained, no vulnerability" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: via tauri-utils > urlpattern; unmaintained, no vulnerability" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: via tauri-utils > urlpattern; unmaintained, no vulnerability" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: via tauri-utils > urlpattern; unmaintained, no vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
